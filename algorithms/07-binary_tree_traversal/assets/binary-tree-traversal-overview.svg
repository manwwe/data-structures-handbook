<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Binary Tree Traversal</title>
  <desc id="desc">ONE TREE, THREE ORDERS Root 4; children 2 and 6; 2 has children 1 and 3 Every traversal visits all five nodes exactly once. CHOOSE WHEN TO VISIT THE NODE Preorder: 4, 2, 1, 3, 6 Inorder: 1, 2, 3, 4, 6. Postorder: 1, 3, 2, 6, 4. STOP AT NULL CHILDREN Time O(n) · recursion O(h + 1) Only a binary search tree guarantees sorted inorder output.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1200" height="720" rx="24" fill="#101c30" />
    <text x="56" y="55" fill="#62ddd0" font-size="15">ALGORITHMS / 07</text>
    <text x="56" y="108" fill="#f3f7ff" font-size="34">Binary Tree Traversal, at a glance</text>
    <text x="56" y="149" fill="#bbcadc" font-size="20">Recognize the pattern. Follow the rule. Check the result.</text>
    <rect x="56" y="195" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="234" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="241" fill="#8af1e5" font-size="22">1</text>
    <text x="142" y="227" fill="#8af1e5" font-size="17">ONE TREE, THREE ORDERS</text>
    <text x="142" y="263" fill="#d4caff" font-size="25">Root 4; children 2 and 6; 2 has children 1 and 3</text>
    <text x="142" y="297" fill="#bbcadc" font-size="19">Every traversal visits all five nodes exactly once.</text>
    <rect x="56" y="339" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="378" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="385" fill="#8af1e5" font-size="22">2</text>
    <text x="142" y="371" fill="#8af1e5" font-size="17">CHOOSE WHEN TO VISIT THE NODE</text>
    <text x="142" y="407" fill="#d4caff" font-size="25">Preorder: 4, 2, 1, 3, 6</text>
    <text x="142" y="441" fill="#bbcadc" font-size="19">Inorder: 1, 2, 3, 4, 6. Postorder: 1, 3, 2, 6, 4.</text>
    <rect x="56" y="483" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="522" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="529" fill="#8af1e5" font-size="22">3</text>
    <text x="142" y="515" fill="#8af1e5" font-size="17">STOP AT NULL CHILDREN</text>
    <text x="142" y="551" fill="#d4caff" font-size="25">Time O(n) · recursion O(h + 1)</text>
    <text x="142" y="585" fill="#bbcadc" font-size="19">Only a binary search tree guarantees sorted inorder output.</text>
    <text x="56" y="687" fill="#bbcadc" font-size="17">C++17 · Worked examples and exercises in the accompanying lesson.</text>
  </g>
</svg>