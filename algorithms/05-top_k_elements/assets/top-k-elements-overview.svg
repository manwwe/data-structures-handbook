<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Top K Elements</title>
  <desc id="desc">KEEP ONLY K CANDIDATES [4, 1, 7]     k = 3 The heap minimum, 1, is the weakest retained value. REPLACE THE MINIMUM Read 3 → retain [3, 4, 7] Read 9 → retain [4, 7, 9]. EXTRACT AND REVERSE Answer: [9, 7, 4] Duplicates count. The input stays unchanged.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1200" height="720" rx="24" fill="#101c30" />
    <text x="56" y="55" fill="#62ddd0" font-size="15">ALGORITHMS / 05</text>
    <text x="56" y="108" fill="#f3f7ff" font-size="34">Top K Elements, at a glance</text>
    <text x="56" y="149" fill="#bbcadc" font-size="20">Recognize the pattern. Follow the rule. Check the result.</text>
    <rect x="56" y="195" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="234" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="241" fill="#8af1e5" font-size="22">1</text>
    <text x="142" y="227" fill="#8af1e5" font-size="17">KEEP ONLY K CANDIDATES</text>
    <text x="142" y="263" fill="#d4caff" font-size="25">[4, 1, 7]     k = 3</text>
    <text x="142" y="297" fill="#bbcadc" font-size="19">The heap minimum, 1, is the weakest retained value.</text>
    <rect x="56" y="339" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="378" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="385" fill="#8af1e5" font-size="22">2</text>
    <text x="142" y="371" fill="#8af1e5" font-size="17">REPLACE THE MINIMUM</text>
    <text x="142" y="407" fill="#d4caff" font-size="25">Read 3 → retain [3, 4, 7]</text>
    <text x="142" y="441" fill="#bbcadc" font-size="19">Read 9 → retain [4, 7, 9].</text>
    <rect x="56" y="483" width="1088" height="124" rx="12" fill="#202d45" />
    <circle cx="100" cy="522" r="22" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="94" y="529" fill="#8af1e5" font-size="22">3</text>
    <text x="142" y="515" fill="#8af1e5" font-size="17">EXTRACT AND REVERSE</text>
    <text x="142" y="551" fill="#d4caff" font-size="25">Answer: [9, 7, 4]</text>
    <text x="142" y="585" fill="#bbcadc" font-size="19">Duplicates count. The input stays unchanged.</text>
    <text x="56" y="687" fill="#bbcadc" font-size="17">C++17 · Worked examples and exercises in the accompanying lesson.</text>
  </g>
</svg>