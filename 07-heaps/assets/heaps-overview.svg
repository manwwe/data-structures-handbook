<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Heaps, at a glance</title>
  <desc id="description">Min-heap containing 10, 20, 15, 40, 30, and 25, shown as a complete binary tree and its level-order array.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0L7 3L0 6" fill="none" stroke="#8199b3" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="24" fill="#101c30" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="55" font-size="15" fill="#62ddd0" text-anchor="start" font-weight="700">DATA STRUCTURES / 07</text>
    <text x="56" y="108" font-size="38" fill="#f3f7ff" text-anchor="start" font-weight="700">Heaps, at a glance</text>
    <text x="56" y="144" font-size="20" fill="#bbcadc" text-anchor="start">A complete binary tree with an ordering rule between parents and children.</text>
    <text x="750" y="224" font-size="18" fill="#8af1e5" text-anchor="start" font-weight="700">ARRAY REPRESENTATION</text>
    <path d="M355 245L215 345" fill="none" stroke="#8199b3" stroke-width="3" />
    <path d="M355 245L495 345" fill="none" stroke="#8199b3" stroke-width="3" />
    <path d="M215 345L140 445" fill="none" stroke="#8199b3" stroke-width="3" />
    <path d="M215 345L290 445" fill="none" stroke="#8199b3" stroke-width="3" />
    <path d="M495 345L420 445" fill="none" stroke="#8199b3" stroke-width="3" />
    <circle cx="355" cy="245" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="355" y="253" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">10</text>
    <circle cx="215" cy="345" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="215" y="353" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">20</text>
    <circle cx="495" cy="345" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="495" y="353" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">15</text>
    <circle cx="140" cy="445" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="140" y="453" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">40</text>
    <circle cx="290" cy="445" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="290" y="453" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">30</text>
    <circle cx="420" cy="445" r="32" fill="#202d45" stroke="#8af1e5" stroke-width="3" />
    <text x="420" y="453" font-size="24" fill="#8af1e5" text-anchor="middle" font-weight="700">25</text>
    <text x="761" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">0</text>
    <rect x="730" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="761" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">10</text>
    <text x="827" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">1</text>
    <rect x="796" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="827" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">20</text>
    <text x="893" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">2</text>
    <rect x="862" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="893" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">15</text>
    <text x="959" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">3</text>
    <rect x="928" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="959" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">40</text>
    <text x="1025" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">4</text>
    <rect x="994" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="1025" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">30</text>
    <text x="1091" y="272" font-size="17" fill="#bbcadc" text-anchor="middle">5</text>
    <rect x="1060" y="289" width="62" height="62" rx="3" fill="#143f49" stroke="#8af1e5" stroke-width="2" />
    <text x="1091" y="330" font-size="24" fill="#8af1e5" text-anchor="middle">25</text>
    <text x="730" y="394" font-size="23" fill="#d4caff" text-anchor="start" font-weight="700">Parent ≤ each child</text>
    <text x="730" y="432" font-size="20" fill="#bbcadc" text-anchor="start">Fill each level from left to right.</text>
    <text x="730" y="470" font-size="20" fill="#bbcadc" text-anchor="start">The array is not fully sorted.</text>
    <rect x="56" y="548" width="340" height="100" rx="10" fill="#202d45" />
    <text x="76" y="579" font-size="20" fill="#8af1e5" text-anchor="start" font-weight="700">Peek minimum</text>
    <text x="76" y="607" font-size="18" fill="#bbcadc" text-anchor="start">O(1): read the root.</text>
    <rect x="430" y="548" width="340" height="100" rx="10" fill="#202d45" />
    <text x="450" y="579" font-size="20" fill="#8af1e5" text-anchor="start" font-weight="700">Insert / remove minimum</text>
    <text x="450" y="607" font-size="18" fill="#bbcadc" text-anchor="start">O(log n) heap adjustments.</text>
    <rect x="804" y="548" width="340" height="100" rx="10" fill="#202d45" />
    <text x="824" y="579" font-size="20" fill="#8af1e5" text-anchor="start" font-weight="700">Build from n values</text>
    <text x="824" y="607" font-size="18" fill="#bbcadc" text-anchor="start">O(n) with bottom-up sifting.</text>
    <text x="56" y="692" font-size="15" fill="#bbcadc" text-anchor="start">Min-heap example. In a zero-based array, children of index i are 2i + 1 and 2i + 2 when present.</text>
  </g>
